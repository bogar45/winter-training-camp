<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PWA-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bot Lab">
<meta name="theme-color" content="#0a2240">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<!--/PWA-->
<!--PAGE-->
<title>Bot Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a robotics workshop on blueprint paper. Navy drafting grid, cyan linework, tangerine for anything you can press. */
:root{
  --bg:#0a2240; --bg-deep:#071a33; --panel:#0f3058; --panel-2:#143c6d; --panel-3:#1a4a84;
  --grid:rgba(140,200,255,.07); --grid-major:rgba(140,200,255,.12);
  --line:rgba(150,205,255,.22); --line-strong:rgba(150,205,255,.45);
  --ink:#eaf4ff; --ink-dim:#a9c6e8; --ink-faint:#7193bd;
  --accent:#ff8a3d; --accent-deep:#c95a12; --accent-ink:#2b1300;
  --cyan:#7fd8ff; --good:#5be3a8; --good-deep:#1f8f62; --bad:#ff6b7a; --gold:#ffd166;
  --cat:#ffb347; --dog:#7fd8ff;
  --f-display:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
b,strong{color:#fff}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.dim{color:var(--ink-dim)}
.card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r);position:relative}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* Buttons */
.btn{--b:var(--panel-3);--s:#0b2747;--t:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
  padding:12px 20px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--b);color:var(--t);box-shadow:0 4px 0 var(--s);transition:transform .08s,box-shadow .08s,filter .15s;user-select:none;-webkit-user-select:none}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--s)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4);transform:none;box-shadow:0 4px 0 var(--s)}
.btn.primary{--b:var(--accent);--s:var(--accent-deep);--t:var(--accent-ink)}
.btn.good{--b:var(--good);--s:var(--good-deep);--t:#04261a}
.btn.ghost{--b:transparent;--s:transparent;border:1px solid var(--line-strong);color:var(--ink-dim)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.lg{padding:16px 28px;font-size:20px}
.btn:focus-visible,.choice:focus-visible,.spot:focus-visible,input:focus-visible,.mcard:focus-visible,.side-card:focus-visible,.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.pulse:not(:disabled){animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 var(--s),0 0 0 0 rgba(255,138,61,.55)}50%{box-shadow:0 4px 0 var(--s),0 0 0 10px rgba(255,138,61,0)}}

/* Top bar */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px}
.brand h1{font-size:24px;letter-spacing:.08em;text-transform:uppercase}
.xpbox{display:flex;align-items:center;gap:12px;flex:1;min-width:220px;justify-content:flex-end}
.rank{text-align:right;line-height:1.15}
.rank .r-name{font-family:var(--f-display);font-weight:700;font-size:16px}
.rank .r-xp{font-family:var(--f-mono);font-size:12px;color:var(--ink-dim)}
.xpbar{width:140px;height:10px;border-radius:6px;background:var(--bg-deep);border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:6px;transition:width .6s}
.streak{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-weight:700;color:var(--gold)}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:center;padding:22px;margin-bottom:22px;overflow:hidden}
.hero .robot-wrap{width:100%;max-width:280px;margin:0 auto}
.hero h2{font-size:clamp(26px,4.2vw,40px);line-height:1.05}
.hero .lead{font-size:18px;color:var(--ink-dim);margin-top:10px;max-width:52ch}
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.part{font-family:var(--f-mono);font-size:12px;padding:8px 10px;border-radius:10px;border:1px dashed var(--line);color:var(--ink-faint);display:flex;align-items:center;gap:8px;min-width:0}
.part span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part.on{border-style:solid;border-color:rgba(91,227,168,.5);color:var(--good);background:rgba(91,227,168,.07)}
.part .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.section-h{display:flex;align-items:baseline;gap:12px;margin:8px 0 12px}
.section-h h3{font-size:20px;text-transform:uppercase;letter-spacing:.08em}
.missions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mcard{text-align:left;padding:16px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel));border-radius:var(--r);color:var(--ink);min-height:178px;transition:transform .15s,border-color .15s}
.mcard:hover:not(.locked){transform:translateY(-3px);border-color:var(--accent)}
.mcard .num{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--accent);letter-spacing:.1em}
.mcard h4{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.1}
.mcard .topic{font-family:var(--f-mono);font-size:12px;color:var(--cyan);letter-spacing:.04em}
.mcard p{font-size:15px;color:var(--ink-dim)}
.mcard .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:8px}
.mcard.locked{opacity:.5;cursor:not-allowed}
.mcard.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 30px -12px rgba(255,138,61,.5)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.side{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
.side-card{text-align:left;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--panel-2),var(--panel));color:var(--ink);display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.side-card:hover{transform:translateY(-3px);border-color:var(--cyan)}
.side-card h4{font-family:var(--f-display);font-size:20px;margin:0}
.side-card p{font-size:15px;color:var(--ink-dim)}
.side-card .big{font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--gold);margin-top:auto}
.badge-new{display:inline-block;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.08em}

/* Robot */
.robot-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.blink{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.spin-slow{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.spin-rev{animation:spin 9s linear infinite reverse;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.glow-pulse{animation:gp 1.8s ease-in-out infinite}
@keyframes gp{0%,100%{opacity:.55}50%{opacity:1}}
.talkbar{animation:tb .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes tb{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.install{animation:install 1.1s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes install{0%{opacity:0;transform:scale(.2)}60%{opacity:1}100%{transform:scale(1)}}

/* Mission screen */
.m-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.m-title{flex:1;min-width:180px}
.m-title h1{font-size:clamp(24px,3.6vw,32px);line-height:1.05}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pips i{width:22px;height:8px;border-radius:4px;background:var(--bg-deep);border:1px solid var(--line)}
.pips i.done{background:var(--cyan);border-color:var(--cyan)}
.pips i.cur{background:var(--accent);border-color:var(--accent)}
.m-robot{display:flex;gap:14px;align-items:flex-end;margin-bottom:14px}
.robot-sm{width:92px;flex:none}
.bubble{position:relative;background:#eaf4ff;color:#0b223f;border-radius:16px;padding:14px 18px;font-size:18px;line-height:1.45;flex:1;min-width:0;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.bubble b,.bubble strong{color:#0b223f}
.bubble:before{content:"";position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:#eaf4ff;border-left:0}
.bubble .who{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#3a6aa0;margin-bottom:2px}
.bubble.fresh{animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.2}to{transform:none;opacity:1}}
.stage{padding:22px;min-height:200px}
.stage-in{animation:stagein .35s ease-out}
@keyframes stagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m-foot{display:flex;justify-content:flex-end;margin-top:16px;position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.m-foot:before{content:"";position:absolute;inset:0 -16px;background:linear-gradient(180deg,rgba(10,34,64,0),rgba(10,34,64,.85) 45%);z-index:-1}

/* Generic content blocks */
.callout{border-left:4px solid var(--accent);background:rgba(255,138,61,.08);padding:12px 16px;border-radius:0 10px 10px 0}
.callout.cyan{border-color:var(--cyan);background:rgba(127,216,255,.07)}
.formula{font-family:var(--f-mono);font-size:clamp(16px,2.6vw,22px);text-align:center;padding:16px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--bg-deep)}
.formula .hi{color:var(--accent)}
.formula .hi2{color:var(--cyan)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:500}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--f-mono)}
.tbl td:first-child{font-family:var(--f-body);font-weight:700}
.tbl tr.best td{color:var(--good)}
.scroll-x{overflow-x:auto;max-width:100%}
.svgbox{width:100%;max-width:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.svgbox text{font-family:var(--f-mono)}
.goal{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:14px;color:var(--ink-dim);padding:10px 14px;border-radius:10px;border:1px dashed var(--line-strong)}
.goal.met{border-style:solid;border-color:var(--good);color:var(--good);background:rgba(91,227,168,.08)}
.goal .chk{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;flex:none;display:grid;place-items:center}
.goal.met .chk{background:var(--good)}
.goal.met .chk:after{content:"";width:5px;height:9px;border:solid #04261a;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.two-col{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 14px;font-family:var(--f-mono);font-size:13px;color:var(--ink-dim)}
.seg button.on{background:var(--cyan);color:#062038}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.big-num{font-family:var(--f-mono);font-weight:700;font-size:clamp(26px,5vw,40px);line-height:1.1}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kv > div{padding:12px;border-radius:10px;background:var(--bg-deep);border:1px solid var(--line)}
.kv .v{font-family:var(--f-mono);font-weight:700;font-size:22px}

/* Quiz */
.q-text{font-size:clamp(19px,2.6vw,23px);line-height:1.45;max-width:60ch}
.q-text .em{color:var(--accent);font-weight:700}
.ans-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.ans{width:170px;max-width:100%;font-family:var(--f-mono);font-size:26px;font-weight:700;padding:10px 14px;border-radius:12px;border:2px solid var(--line-strong);background:var(--bg-deep);color:var(--ink);text-align:center}
.ans:focus{border-color:var(--accent);outline:none}
.unit{font-family:var(--f-mono);font-size:22px;color:var(--ink-dim)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:18px}
.choice{text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line-strong);background:var(--bg-deep);color:var(--ink);font-size:18px;transition:border-color .15s,background .15s}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.right{border-color:var(--good);background:rgba(91,227,168,.12)}
.choice.wrong{border-color:var(--bad);background:rgba(255,107,122,.1)}
.choice:disabled{cursor:default}
.feedback{margin-top:18px;padding:14px 16px;border-radius:12px;font-size:17px}
.feedback.ok{background:rgba(91,227,168,.1);border:1px solid rgba(91,227,168,.5)}
.feedback.hint{background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.45)}
.feedback.reveal{background:rgba(127,216,255,.08);border:1px solid rgba(127,216,255,.45)}
.feedback .fh{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.feedback.ok .fh{color:var(--good)}
.feedback.hint .fh{color:var(--gold)}
.feedback.reveal .fh{color:var(--cyan)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* Real-world cards */
.real-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.real{padding:16px;border-radius:12px;background:var(--bg-deep);border:1px solid var(--line)}
.real .tag{color:var(--gold)}
.real h4{font-family:var(--f-display);font-size:19px;margin:4px 0 6px}
.real p{font-size:16px;color:var(--ink-dim)}

/* Complete screen */
.complete{text-align:center;padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.complete .robot-wrap{width:220px}
.complete h2{font-size:clamp(28px,5vw,44px)}
.bigstars{display:flex;gap:10px}
.bigstars svg{width:52px;height:52px}
.bigstars svg.on{animation:starin .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starin{from{transform:scale(0) rotate(-60deg)}to{transform:none}}
.upgrade{font-family:var(--f-mono);color:var(--good);border:1px solid rgba(91,227,168,.5);background:rgba(91,227,168,.08);border-radius:10px;padding:10px 16px;letter-spacing:.06em}

/* Speed round */
.speed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:20px;align-items:start}
.sp-problem{font-family:var(--f-mono);font-weight:700;font-size:clamp(30px,7vw,56px);text-align:center;padding:26px 10px 8px;min-height:120px;line-height:1.15}
.sp-answer{font-family:var(--f-mono);font-weight:700;font-size:40px;text-align:center;min-height:62px;color:var(--accent);border-bottom:2px dashed var(--line-strong);margin:0 auto;width:min(260px,100%)}
.sp-hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-mono)}
.timer{height:10px;border-radius:6px;background:var(--bg-deep);overflow:hidden;border:1px solid var(--line);margin-top:12px}
.timer i{display:block;height:100%;background:var(--cyan);transition:width .25s linear}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{font-family:var(--f-mono);font-weight:700;font-size:26px;padding:14px 0;border-radius:12px;border:1px solid var(--line-strong);background:var(--panel-3);color:var(--ink);box-shadow:0 3px 0 #0b2747}
.keypad button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b2747}
.keypad .enter{grid-column:span 3;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-deep);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:22px}
.combo{font-family:var(--f-display);font-weight:700;color:var(--gold);font-size:22px}
.flash-ok{animation:fok .35s}
@keyframes fok{0%{color:var(--good);transform:scale(1.08)}100%{transform:none}}

/* Fermi */
.fermi-scale{margin-top:16px}
.guess-readout{font-family:var(--f-mono);font-weight:700;font-size:clamp(26px,6vw,44px);color:var(--accent);text-align:center}
.guess-words{text-align:center;color:var(--ink-dim);font-family:var(--f-mono)}

/* Report */
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{display:block;width:100%;background:var(--cyan);border-radius:4px 4px 0 0;min-height:2px}
.bars .b span{font-family:var(--f-mono);font-size:10px;color:var(--ink-faint)}

/* Onboarding */
.onb{max-width:620px;margin:6vh auto 0;padding:28px;display:flex;flex-direction:column;gap:18px;align-items:stretch}
.onb .robot-wrap{width:200px;margin:0 auto}
.onb h2{font-size:clamp(28px,5vw,40px);text-align:center}
.onb p{text-align:center;color:var(--ink-dim);font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font-size:22px;padding:12px 16px;border-radius:12px;border:2px solid var(--line-strong);background:var(--bg-deep);color:var(--ink)}
.field input:focus{border-color:var(--accent);outline:none}
.swatches{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.swatch{width:46px;height:46px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px var(--line-strong)}
.swatch.on{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}

/* Toast + confetti */
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end}
.toast{font-family:var(--f-mono);font-weight:700;background:var(--gold);color:#2a1d00;padding:8px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:toast 1.8s ease forwards}
.toast.rank{background:var(--accent);color:var(--accent-ink)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

/* Widgets */
.court-floor{fill:#0c2a4c;stroke:var(--line-strong);stroke-width:2}
.court-line{fill:none;stroke:rgba(150,205,255,.55);stroke-width:2}
.spot{cursor:pointer}
.spot circle.ring{fill:rgba(255,138,61,.12);stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4}
.spot.sel circle.ring{fill:rgba(255,138,61,.35);stroke-dasharray:none;stroke-width:3}
.spot text{fill:var(--ink);font-size:13px;text-anchor:middle;pointer-events:none}
.handle{cursor:grab;fill:var(--accent);stroke:#fff;stroke-width:3}
.handle:active{cursor:grabbing}
.axis text{fill:var(--ink-faint);font-size:11px}
.axis line,.axis path{stroke:var(--line-strong)}
.chip{font-family:var(--f-mono);font-size:15px;padding:7px 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--bg-deep);color:var(--ink)}
.chip.on{background:var(--cyan);color:#062038;border-color:var(--cyan)}
.chip.seen{border-color:var(--good)}
.corpus{font-family:var(--f-mono);font-size:14px;line-height:1.8;color:var(--ink-dim);padding:12px 14px;border-radius:10px;background:var(--bg-deep);border:1px solid var(--line);max-height:200px;overflow:auto}
.sentence-out{font-family:var(--f-mono);font-size:clamp(18px,3vw,24px);min-height:40px;padding:10px 14px;border-radius:10px;background:var(--bg-deep);border:1px solid var(--line)}
.sentence-out .w{display:inline-block;animation:pop .3s}
.cipher-text{font-family:var(--f-mono);font-size:clamp(18px,3.4vw,26px);letter-spacing:.12em;word-break:break-word}
.pix{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:min(300px,100%);margin:0 auto}
.pix div{aspect-ratio:1;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;border-radius:2px;max-width:100%}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;text-align:center;padding:18px}
  .hero .lead{margin-inline:auto}
  .hero .robot-wrap{max-width:200px}
  .missions,.side{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two-col,.speed{grid-template-columns:1fr}
  .real-grid{grid-template-columns:1fr}
  .stage{padding:16px}
  .xpbox{justify-content:flex-start;min-width:0}
  .bubble{font-size:16px;padding:12px 14px}
  .robot-sm{width:70px}
  .xpbar{width:80px}
}
@media (max-width:480px){
  .missions,.side{grid-template-columns:1fr}
  .parts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mcard{min-height:0}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
<!--/PAGE-->
</head>
<body>
<!--BODY-->
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<canvas id="confetti"></canvas>
<script>
"use strict";
/* ============================== Utilities ============================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const app = $('#app');
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pad = n => String(n).padStart(2, '0');
const fmt = (n, d = 0) => Number(n).toLocaleString('en-US', { maximumFractionDigits: d });
const money = n => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dayNum = s => Math.round(new Date(s + 'T12:00:00').getTime() / 864e5);
function svgPt(svg, e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function draggable(el, svg, onMove, onEnd) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const mv = ev => onMove(svgPt(svg, ev));
    const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); onEnd && onEnd(); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
}
function bigWords(n) {
  const a = Math.abs(n);
  const units = [[1e12, 'trillion'], [1e9, 'billion'], [1e6, 'million']];
  for (const [v, w] of units) if (a >= v) { const x = n / v; return (x >= 100 ? fmt(x, 0) : x >= 10 ? fmt(x, 1) : fmt(x, 2)) + ' ' + w; }
  if (a >= 100) return fmt(Math.round(n));
  if (a >= 1) return fmt(n, 1);
  return fmt(n, 3);
}
function round2sig(n) { if (n === 0) return 0; const p = Math.pow(10, Math.floor(Math.log10(Math.abs(n))) - 1); return Math.round(n / p) * p; }
let cleanups = [];
function onCleanup(fn) { cleanups.push(fn); }
function runCleanups() { cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; }

/* ============================== State ============================== */
const KEY = 'botlab.v1';
function defaults() {
  return { name: '', robot: '', color: '#ff8a3d', xp: 0, missions: {}, sound: true, unlockAll: false,
    streak: { last: '', count: 0 }, speedBest: 0, fermi: {}, fermiStars: 0,
    stats: { problems: 0, correct: 0, sec: 0, days: {} }, cert: false };
}
let S = (() => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') { const d = defaults(); return Object.assign(d, s, { stats: Object.assign(d.stats, s.stats || {}), streak: Object.assign(d.streak, s.streak || {}) }); } } catch (e) {} return defaults(); })();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const RANKS = [[0, 'Rookie'], [150, 'Apprentice'], [400, 'Analyst'], [800, 'Engineer'], [1300, 'Scientist'], [2000, 'AI Architect'], [3000, 'Chief AI Architect'], [5000, 'Legend']];
function rankOf(xp) { let i = 0; RANKS.forEach((r, k) => { if (xp >= r[0]) i = k; }); return i; }
function dayRec() { const t = today(); S.stats.days[t] = S.stats.days[t] || { sec: 0, problems: 0 }; return S.stats.days[t]; }
function markActive() {
  const t = today();
  if (S.streak.last === t) return;
  S.streak.count = (S.streak.last && dayNum(t) - dayNum(S.streak.last) === 1) ? S.streak.count + 1 : 1;
  S.streak.last = t;
}
function addXP(n) {
  if (!n) return;
  const before = rankOf(S.xp);
  S.xp += n; markActive(); save();
  toast('+' + n + ' XP');
  const after = rankOf(S.xp);
  if (after > before) { setTimeout(() => { toast('RANK UP: ' + RANKS[after][1], 'rank'); Sound.level(); confetti(120); }, 500); }
  const bar = $('.xpbar i'); if (bar) refreshTopbar();
}
function logProblem(correct) { S.stats.problems++; if (correct) S.stats.correct++; dayRec().problems++; save(); }
function missionUnlocked(i) { return S.unlockAll || i === 0 || (S.missions[MISSIONS[i - 1].id] || {}).done; }
function partsOn() { const p = {}; MISSIONS.forEach(m => { if ((S.missions[m.id] || {}).done) p[m.part] = true; }); return p; }
/* active-time tracker: counts time while the page is visible and the player touched something in the last 90 s */
let lastInteract = Date.now();
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { lastInteract = Date.now(); }, { passive: true }));
setInterval(() => {
  if (document.visibilityState === 'visible' && Date.now() - lastInteract < 90000 && S.name) { S.stats.sec += 10; dayRec().sec += 10; save(); }
}, 10000);

/* ============================== Sound + FX ============================== */
const Sound = {
  ctx: null,
  ensure() { if (!S.sound) return null; try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { return null; } return this.ctx; },
  tone(f, d = .12, type = 'sine', v = .08, delay = 0, slide) {
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .03);
  },
  click() { this.tone(720, .05, 'square', .025); },
  good() { [523, 659, 784].forEach((f, i) => this.tone(f, .18, 'triangle', .09, i * .07)); },
  bad() { this.tone(200, .25, 'sawtooth', .04, 0, 120); },
  swish() { this.tone(300, .25, 'sine', .05, 0, 900); },
  swoosh() { this.tone(900, .18, 'sine', .04, 0, 300); },
  tick() { this.tone(1200, .03, 'square', .02); },
  level() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, .3, 'triangle', .1, i * .09)); },
  boot() { [220, 330, 440, 660].forEach((f, i) => this.tone(f, .2, 'square', .035, i * .1)); }
};
function toast(text, cls = '') { const t = document.createElement('div'); t.className = 'toast ' + cls; t.textContent = text; $('#toast').appendChild(t); setTimeout(() => t.remove(), 1900); }
const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], confettiOn = false;
function confetti(n = 80) {
  if (reduceMotion()) return;
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  const cols = ['#ff8a3d', '#ffd166', '#5be3a8', '#7fd8ff', '#ffffff', '#ff6b7a'];
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth * (.2 + Math.random() * .6), y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pick(cols), life: 0 });
  if (!confettiOn) { confettiOn = true; requestAnimationFrame(confettiLoop); }
}
function confettiLoop() {
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); cx.clearRect(0, 0, innerWidth, innerHeight);
  parts.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); });
  parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 400);
  if (parts.length) requestAnimationFrame(confettiLoop); else { confettiOn = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
}
function starSVG(on) { return `<svg viewBox="0 0 24 24" class="${on ? 'on' : ''}"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="${on ? 'var(--gold)' : 'none'}" stroke="${on ? 'var(--gold)' : 'var(--ink-faint)'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`; }
function starsRow(n, cls = 'stars') { return `<span class="${cls}">${[1, 2, 3].map(k => starSVG(k <= n)).join('')}</span>`; }

/* ============================== Robot ============================== */
function shade(hex, amt) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; r = clamp(Math.round(r * (1 + amt)), 0, 255); g = clamp(Math.round(g * (1 + amt)), 0, 255); b = clamp(Math.round(b * (1 + amt)), 0, 255); return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); }
function gearPath(cx, cy, r, teeth) { let d = ''; for (let i = 0; i < teeth * 2; i++) { const a = i * Math.PI / teeth, rr = i % 2 ? r * .78 : r; const a1 = a - Math.PI / teeth / 2, a2 = a + Math.PI / teeth / 2; d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a1)).toFixed(1) + ' ' + (cy + rr * Math.sin(a1)).toFixed(1) + 'L' + (cx + rr * Math.cos(a2)).toFixed(1) + ' ' + (cy + rr * Math.sin(a2)).toFixed(1); } return d + 'Z'; }
function robotSVG(p = {}, opts = {}) {
  const col = opts.color || S.color || '#ff8a3d', dk = shade(col, -.35), lt = shade(col, .25);
  const fresh = k => opts.fresh === k ? ' install' : '';
  const happy = opts.mood === 'happy';
  const eyeFill = p.chip ? '#9ff3ff' : '#2b4566';
  const eye = (x) => happy
    ? `<path d="M${x - 9} 78 q9 -12 18 0" stroke="${eyeFill}" stroke-width="5" fill="none" stroke-linecap="round"/>`
    : `<g class="blink"><circle cx="${x}" cy="74" r="9" fill="${eyeFill}"/>${p.chip ? `<circle cx="${x + 3}" cy="71" r="3" fill="#fff"/>` : ''}</g>`;
  return `<svg viewBox="-20 -20 240 270" role="img" aria-label="Robot">
  <defs>
    <radialGradient id="coreg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7c2"/><stop offset=".45" stop-color="#ffd166"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  ${p.shield ? `<g class="${fresh('shield')}"><circle class="spin-slow" cx="100" cy="122" r="118" fill="none" stroke="#7fd8ff" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="10 8"/><circle cx="100" cy="122" r="108" fill="rgba(127,216,255,.05)" stroke="none"/></g>` : ''}
  <g class="${opts.still ? '' : 'bob'}">
    <!-- antenna -->
    ${p.voice ? `<g class="${fresh('voice')}"><line x1="100" y1="34" x2="100" y2="4" stroke="${dk}" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="2" r="9" fill="#ff6b7a"/><circle class="glow-pulse" cx="100" cy="2" r="15" fill="#ff6b7a" opacity=".35" filter="url(#soft)"/></g>`
      : `<line x1="100" y1="34" x2="100" y2="22" stroke="${dk}" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="20" r="5" fill="${dk}"/>`}
    <!-- brain dome -->
    ${p.brain ? `<g class="${fresh('brain')}"><path d="M52 44 Q100 -14 148 44 Z" fill="rgba(127,216,255,.18)" stroke="#7fd8ff" stroke-width="2.5"/><path class="spin-slow" d="${gearPath(86, 30, 13, 8)}" fill="#ffd166"/><path class="spin-rev" d="${gearPath(112, 26, 10, 7)}" fill="#5be3a8"/><path class="spin-slow" d="${gearPath(126, 38, 6, 6)}" fill="#7fd8ff"/></g>` : ''}
    <!-- ears -->
    <rect x="28" y="62" width="14" height="30" rx="5" fill="${dk}"/><rect x="158" y="62" width="14" height="30" rx="5" fill="${dk}"/>
    <!-- head -->
    <rect x="38" y="34" width="124" height="90" rx="24" fill="${col}"/>
    <rect x="38" y="34" width="124" height="22" rx="11" fill="${lt}" opacity=".45"/>
    <rect x="52" y="48" width="96" height="62" rx="16" fill="#0a1a2e" stroke="${dk}" stroke-width="3"/>
    ${p.lens ? `<g class="${fresh('lens')}"><circle cx="82" cy="74" r="15" fill="none" stroke="#7fd8ff" stroke-width="3"/><circle cx="118" cy="74" r="15" fill="none" stroke="#7fd8ff" stroke-width="3"/><line x1="97" y1="74" x2="103" y2="74" stroke="#7fd8ff" stroke-width="3"/></g>` : ''}
    <g class="${fresh('chip')}">${eye(82)}${eye(118)}</g>
    ${p.chip ? `<circle cx="82" cy="74" r="14" fill="#9ff3ff" opacity=".18" filter="url(#soft)"/><circle cx="118" cy="74" r="14" fill="#9ff3ff" opacity=".18" filter="url(#soft)"/>` : ''}
    ${p.voice ? `<g class="${fresh('voice')}">${[0, 1, 2, 3, 4].map(i => `<rect class="talkbar" style="animation-delay:${i * .12}s" x="${84 + i * 7}" y="90" width="4" height="12" rx="2" fill="#5be3a8"/>`).join('')}</g>`
      : `<rect x="86" y="96" width="28" height="4" rx="2" fill="#2b4566"/>`}
    <!-- neck + body -->
    <rect x="86" y="122" width="28" height="12" fill="${dk}"/>
    <rect x="46" y="132" width="108" height="78" rx="18" fill="${col}"/>
    <rect x="46" y="132" width="108" height="16" rx="8" fill="${lt}" opacity=".35"/>
    <rect x="66" y="144" width="68" height="52" rx="10" fill="#0a1a2e" stroke="${dk}" stroke-width="3"/>
    ${p.core ? `<g class="${fresh('core')}"><circle class="glow-pulse" cx="100" cy="170" r="22" fill="url(#coreg)"/><circle cx="100" cy="170" r="10" fill="#fff4c4"/></g>` : `<circle cx="100" cy="170" r="10" fill="#2b4566"/>`}
    ${[0, 1, 2].map(i => `<rect x="${72 + i * 6}" y="150" width="3" height="8" rx="1" fill="${p.core ? '#5be3a8' : '#2b4566'}"/>`).join('')}
    <!-- arms -->
    <rect x="22" y="140" width="22" height="52" rx="10" fill="${dk}"/><circle cx="33" cy="198" r="11" fill="${col}" stroke="${dk}" stroke-width="3"/>
    <rect x="156" y="140" width="22" height="52" rx="10" fill="${dk}"/><circle cx="167" cy="198" r="11" fill="${col}" stroke="${dk}" stroke-width="3"/>
    <!-- treads -->
    <rect x="52" y="208" width="96" height="26" rx="13" fill="#132a47" stroke="${dk}" stroke-width="3"/>
    ${[0, 1, 2, 3].map(i => `<circle cx="${68 + i * 21}" cy="221" r="7" fill="${dk}"/>`).join('')}
  </g>
</svg>`;
}

/* ============================== Router ============================== */
function go(screen, arg) {
  runCleanups(); window.scrollTo(0, 0);
  ({ onboarding: screenOnboarding, home: screenHome, mission: screenMission, complete: screenComplete, speed: screenSpeed, fermi: screenFermi, report: screenReport, cert: screenCert })[screen](arg);
}
function topbar() {
  const r = rankOf(S.xp), lo = RANKS[r][0], hi = (RANKS[r + 1] || [S.xp + 1])[0];
  const pct = clamp((S.xp - lo) / (hi - lo) * 100, 0, 100);
  return `<header class="topbar">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 40 40"><rect x="4" y="8" width="32" height="26" rx="8" fill="var(--accent)"/><rect x="9" y="13" width="22" height="15" rx="5" fill="#0a1a2e"/><circle cx="15" cy="20.5" r="3" fill="#9ff3ff"/><circle cx="25" cy="20.5" r="3" fill="#9ff3ff"/><line x1="20" y1="8" x2="20" y2="3" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/></svg><h1>Bot Lab</h1></div>
    <div class="xpbox">
      ${S.streak.count ? `<div class="streak" title="Days in a row"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3-1-3 0-6 1-9z" fill="var(--gold)"/></svg>${S.streak.count}</div>` : ''}
      <div class="rank"><div class="r-name">${RANKS[r][1]}</div><div class="r-xp">${fmt(S.xp)} XP${RANKS[r + 1] ? ' / ' + fmt(hi) : ''}</div></div>
      <div class="xpbar" aria-hidden="true"><i style="width:${pct}%"></i></div>
    </div>
  </header>`;
}
function refreshTopbar() { const t = $('.topbar'); if (t) t.outerHTML = topbar(); }

/* ============================== Onboarding ============================== */
function screenOnboarding() {
  const colors = ['#ff8a3d', '#2ec4b6', '#ff6b7a', '#9b7bff', '#ffd166', '#5b8cff'];
  let step = 0, name = S.name, robot = S.robot, color = S.color;
  function render() {
    app.innerHTML = `<div class="wrap"><div class="card onb">
      <div class="robot-wrap">${robotSVG({}, { color })}</div>
      ${step === 0 ? `
        <span class="tag" style="text-align:center">Welcome to the lab</span>
        <h2>Build a robot brain with math</h2>
        <p>You're the new engineer at Bot Lab. Your robot's brain is empty. Each mission you finish teaches it a real AI skill, using the same math that powers sports analytics, secret codes, and chatbots.</p>
        <div class="field"><label class="label" for="nm">What's your name, engineer?</label><input id="nm" maxlength="20" autocomplete="off" value="${esc(name)}" placeholder="Your name"></div>
        <button class="btn primary lg" id="ok">Next</button>`
      : `
        <span class="tag" style="text-align:center">Robot setup</span>
        <h2>Name your robot</h2>
        <p>It'll talk to you on every mission.</p>
        <div class="field"><label class="label" for="rb">Robot name</label><input id="rb" maxlength="16" autocomplete="off" value="${esc(robot)}" placeholder="e.g. Bolt, Pixel, Zeta"></div>
        <div class="field"><span class="label" style="text-align:center">Paint color</span><div class="swatches">${colors.map(c => `<button class="swatch ${c === color ? 'on' : ''}" data-c="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}</div></div>
        <button class="btn primary lg" id="ok">Power on</button>`}
    </div></div>`;

function parseNum(v) { const s = String(v).replace(/[,$%\s]/g, ''); if (/^-?\d*\.?\d+(\/\d+)?$/.test(s)) { if (s.includes('/')) { const [a, b] = s.split('/'); return +a / +b; } return +s; } return NaN; }
function mountQuiz(el, st, api) {
  const g = st.gen(api.ctx); let tries = 0, finished = false;
  const kind = g.kind || 'num';
  el.innerHTML = `<span class="tag">${g.prediction ? 'Make a prediction' : 'Your turn'}</span>

    <div class="fb-slot"></div>`;

  const fb = (cls, head, body) => { slot.innerHTML = `<div class="feedback ${cls}"><div class="fh">${head}</div><div>${body}</div></div>`; };
  function finish(ok) {

    api.complete();
  }
  function correct() {
    Sound.good(); logProblem(true);
    fb('ok', pick(['Correct!', 'Nailed it!', 'Yes!', 'Exactly right!', 'Boom!']), g.explain || '');
    api.xp(tries === 0 ? 20 : 10); if (tries === 0) confetti(30);

  function wrong(target) {

    const maxTries = kind === 'choice' && g.choices.length <= 2 ? 1 : 2;
    if (tries >= maxTries) { fb('reveal', 'Here\'s how it works', `The answer is <b>${g.answerText != null ? g.answerText : (g.pre || '') + fmt(g.a, 2) + (g.unit ? ' ' + g.unit : '')}</b>. ${g.explain || ''}`); api.xp(5); finish(false); }
    else fb('hint', 'Not quite. Hint:', g.hint || 'Try again!');
  }

        if (k !== g.a) b.classList.add('wrong');

        fb(k === g.a ? 'ok' : 'reveal', k === g.a ? 'Great instinct!' : 'Most people guess that!', g.explain);
        finish(true); return;
      }
      if (k === g.a) { b.classList.add('right'); correct(); }
      else { b.classList.add('wrong'); b.disabled = true; wrong(b); if (finished) $$('.choice', el)[g.a].classList.add('right'); }
    });
  } else {
    const form = $('form', el), inp = $('input', el);
    setTimeout(() => inp.focus({ preventScroll: true }), 80);
    form.onsubmit = e => {
      e.preventDefault(); if (finished) return;
      const v = inp.value.trim(); if (!v) return;
      let ok;
      if (kind === 'letter') ok = v.toUpperCase() === g.a;
      else { const n = parseNum(v); if (isNaN(n)) { fb('hint', 'Numbers only', 'Type a number, like 42 or 1.5.'); return; } ok = Math.abs(n - g.a) <= (g.tol != null ? g.tol : 1e-6); }

    };

}

const SPOTS = [
  { k: 'Layup', x: 250, y: 82, p: .62, v: 2, lx: 250, ly: 118 },

function wShotSim(el, api) {
  const stats = SPOTS.map(() => ({ a: 0, m: 0 })); let sel = 0, busy = false, met = false;
  el.innerHTML = `<div class="two-col">
    <div><svg class="svgbox" viewBox="0 0 500 300" id="court">${courtSVG()}

      <div class="row" style="margin-top:12px"><button class="btn primary" id="s1">Shoot 1</button><button class="btn" id="s10">Shoot 10</button><span class="dim mono" id="selname" style="font-size:14px"></span></div>
    </div>
    <div class="stack">
      <div class="scroll-x"><table class="tbl"><thead><tr><th>Spot</th><th>Shots</th><th>Makes</th><th>Points</th><th>Pts/shot</th></tr></thead><tbody id="tb"></tbody></table></div>
      <div class="goal" id="goal"><span class="chk"></span><span>Take at least 20 shots from every spot</span></div>

  const svg = $('#court', el), ball = $('#ball', el), fx = $('#fx', el);
  function update() {
    $$('.spot', el).forEach(g => g.classList.toggle('sel', +g.dataset.k === sel));
    $('#selname', el).textContent = 'Shooting from: ' + SPOTS[sel].k;
    const pps = stats.map((s, k) => s.a ? s.m * SPOTS[k].v / s.a : -1), best = Math.max(...pps);
    $('#tb', el).innerHTML = SPOTS.map((s, k) => `<tr class="${met && pps[k] === best ? 'best' : ''}"><td>${s.k} <span class="dim mono" style="font-size:12px">(${s.v}pt)</span></td><td>${stats[k].a}</td><td>${stats[k].m}</td><td>${stats[k].m * s.v}</td><td>${stats[k].a ? (stats[k].m * s.v / stats[k].a).toFixed(2) : '–'}</td></tr>`).join('');
    if (!met && stats.every(s => s.a >= 20)) {
      met = true; $('#goal', el).classList.add('met'); Sound.good(); api.xp(20); update();
      const bestK = pps.indexOf(best);
      api.say(`Look at Pts/shot! ${SPOTS[bestK].k} scored the most per shot in your test. Notice the <b>Corner 3</b> beats the Mid-range even though it goes in less often. Why? Let's find out.`);
      api.complete();
    }
  }
  function shot(made, dur, done) {
    const s = SPOTS[sel], x0 = s.x, y0 = s.y, x1 = 250, y1 = 40, peak = Math.min(y0, y1) - 60;
    const t0 = performance.now(); ball.setAttribute('opacity', 1);
    const missDx = (Math.random() < .5 ? -1 : 1) * (14 + Math.random() * 10);
    const step = now => {
      const t = clamp((now - t0) / dur, 0, 1);
      const ex = made ? x1 : x1 + missDx * .6, ey = made ? y1 : y1 - 6;
      const x = x0 + (ex - x0) * t, y = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * peak + t * t * ey;
      ball.setAttribute('cx', x); ball.setAttribute('cy', y);
      if (t < 1) requestAnimationFrame(step);
      else {
        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        txt.setAttribute('x', made ? 250 : 250 + missDx); txt.setAttribute('y', 70); txt.setAttribute('text-anchor', 'middle');
        txt.setAttribute('fill', made ? 'var(--good)' : 'var(--bad)'); txt.setAttribute('font-size', '18'); txt.setAttribute('font-weight', '700');
        txt.textContent = made ? '+' + s.v : 'miss'; fx.appendChild(txt); setTimeout(() => txt.remove(), 500);
        made ? Sound.tone(880, .07, 'triangle', .05) : Sound.tone(160, .07, 'square', .03);
        ball.setAttribute('opacity', 0); done();
      }
    };
    requestAnimationFrame(step);
  }
  function shoot(n) {
    if (busy) return; busy = true; let k = 0;
    const dur = reduceMotion() ? 30 : n > 1 ? 230 : 520;
    const loop = () => {
      if (k >= n) { busy = false; update(); return; }
      const made = Math.random() < SPOTS[sel].p; stats[sel].a++; if (made) stats[sel].m++;
      shot(made, dur, () => { k++; update(); loop(); });
    };
    loop();
  }
  $$('.spot', el).forEach(g => { const f = () => { if (busy) return; sel = +g.dataset.k; Sound.click(); update(); }; g.onclick = f; g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } }; });
  $('#s1', el).onclick = () => shoot(1); $('#s10', el).onclick = () => shoot(10);
  update();
}

    wheel.style.transition = reduceMotion() ? 'none' : 'transform 1.6s cubic-bezier(.15,.8,.25,1)';
    void wheel.getBoundingClientRect();
    wheel.style.transform = `rotate(${rot}deg)`; Sound.swish();
    const t = setTimeout(() => {
      spinning = false; Sound.tone(660, .1, 'triangle', .06);
      if (choice.w === '.' || sentence.length >= 14) {
        done.push(sentence.join(' ')); cur = null; sentence = [];
        if (done.length >= 2 && !met) { met = true; $('#goal', el).classList.add('met'); Sound.level(); confetti(90); api.xp(20); api.say('I\'m talking! Some sentences are silly, because I only look back ONE word. Bigger models look back at thousands of words, so they make more sense.'); api.complete(); }
      } else { sentence.push(choice.w); cur = choice.w; }
      render();
    }, reduceMotion() ? 50 : 1700);
    onCleanup(() => clearTimeout(t));
  }
  $('#teach', el).onsubmit = e => {
    e.preventDefault(); const v = $('#ts', el).value.toLowerCase().replace(/[^a-z' ]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!v || v.split(' ').length < 2) { api.say('Give me a sentence with at least two words!'); return; }
    corpus.push(v); model = bigrams(corpus); $('#ts', el).value = ''; Sound.good();
    api.say(`Learned it! "${esc(v)}" is now in my training data. My counts changed, so I might use your words when I spin.`);
    if (!spinning) render();
  };
  render();
}

  const maxS = Math.max(60, ...days.map(d => d.sec));
  const acc = S.stats.problems ? Math.round(S.stats.correct / S.stats.problems * 100) : 0;
  const totalStars = MISSIONS.reduce((a, m) => a + ((S.missions[m.id] || {}).stars || 0), 0);
  let confirmReset = false;
  app.innerHTML = `<div class="wrap">${topbar()}<header class="m-top"><button class="btn ghost sm" id="back">← Lab</button><div class="m-title"><span class="tag">For grown-ups</span><h1>Lab Report: ${esc(S.name)}</h1></div></header>
    <div class="stack">
      <section class="card stage"><div class="kv">
        <div><span class="label">Time practicing</span><div class="v">${Math.round(S.stats.sec / 60)} min</div></div>
        <div><span class="label">Problems solved</span><div class="v">${fmt(S.stats.problems)}</div></div>
        <div><span class="label">Accuracy</span><div class="v">${acc}%</div></div>
        <div><span class="label">Missions</span><div class="v">${MISSIONS.filter(m => (S.missions[m.id] || {}).done).length}/6 · ${totalStars}★</div></div>
        <div><span class="label">Day streak</span><div class="v">${S.streak.count}</div></div>
        <div><span class="label">Speed best</span><div class="v">${fmt(S.speedBest)}</div></div>
      </div>
      <div style="margin-top:18px"><span class="label">Minutes per day, last 14 days</span><div class="bars">${days.map(d => `<div class="b" title="${d.key}: ${Math.round(d.sec / 60)} min, ${d.prob} problems"><span>${d.sec >= 60 ? Math.round(d.sec / 60) : ''}</span><i style="height:${d.sec / maxS * 85}%"></i><span>${d.lbl}</span></div>`).join('')}</div></div>
      <p class="dim" style="font-size:14px;margin-top:10px">Time counts only while the game is open and being used. Progress is saved on this device only.</p></section>
      <section class="card stage"><span class="tag">What each mission teaches</span>
        <div class="scroll-x" style="margin-top:10px"><table class="tbl"><thead><tr><th>Mission</th><th style="text-align:left">Math skills</th><th>Stars</th></tr></thead><tbody>
        ${MISSIONS.map(m => `<tr><td>${m.num}. ${m.title}</td><td style="text-align:left;font-family:var(--f-body)">${({ shots: 'Percents, decimals, multiplying probabilities, expected value', growth: 'Powers and exponents, percent growth, compound interest, log scales', codes: 'Modular (clock) arithmetic, counting, frequency analysis', vision: 'Coordinate graphs, accuracy %, y = mx + b, classification', learn: 'Lines and slope, prediction, squaring, error, gradient descent', talk: 'Fractions to percents, probability, sampling' })[m.id]}</td><td>${(S.missions[m.id] || {}).done ? starsRow(S.missions[m.id].stars) : '–'}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="dim" style="font-size:14px;margin-top:10px">Good conversation starters: "Why do NBA teams shoot so many threes now?", "How many folds to reach the Moon?", "How does a chatbot pick its next word?"</p></section>
      <section class="card stage"><span class="tag">Settings</span>
        <div class="stack" style="margin-top:12px">
          <div class="row"><span style="flex:1">Sound effects</span><button class="btn sm" id="snd">${S.sound ? 'On' : 'Off'}</button></div>
          <div class="row"><span style="flex:1">Unlock every mission (lets a grown-up preview)</span><button class="btn sm" id="unl">${S.unlockAll ? 'Unlocked' : 'Unlock all'}</button></div>
          <div class="row"><label for="rn" style="flex:1">Robot name</label><input id="rn" class="ans" style="width:180px;font-size:17px" maxlength="16" value="${esc(S.robot)}"><button class="btn sm" id="rnb">Save</button></div>
          <div class="row"><span style="flex:1">Erase all progress on this device</span><button class="btn sm ghost" id="rst" style="color:var(--bad);border-color:var(--bad)">Reset</button></div>
        </div></section>
    </div></div>`;
  $('#back').onclick = () => go('home');
  $('#snd').onclick = () => { S.sound = !S.sound; save(); go('report'); };
  $('#unl').onclick = () => { S.unlockAll = !S.unlockAll; save(); go('report'); };
  $('#rnb').onclick = () => { const v = $('#rn').value.trim(); if (v) { S.robot = v; save(); toast('Saved'); } };
  $('#rst').onclick = () => { if (!confirmReset) { confirmReset = true; $('#rst').textContent = 'Tap again to erase'; return; } S = defaults(); save(); go('onboarding'); };
}

/* ============================== Boot ============================== */
go(S.name ? 'home' : 'onboarding');
</script>
